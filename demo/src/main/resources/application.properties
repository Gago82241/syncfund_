server.port=${PORT:8080}
spring.application.name=syncfund-backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/syncfund_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:syncfund_user}
spring.datasource.password=${DB_PASSWORD:SyncFund2026!}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

jwt.secret=${JWT_SECRET:syncfund-super-secret-key-for-jwt-signing-2026-academic-project}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

logging.level.com.syncfund=DEBUG
